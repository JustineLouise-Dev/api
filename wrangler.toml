name = "api"
main = "src/index.js"
compatibility_date = "2024-11-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RoomDurableObject"

[[durable_objects.bindings]]
name = "VISIT_LOG"
class_name = "VisitLogDurableObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDurableObject"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["VisitLogDurableObject"]

# Set the admin panel's login key as a secret (do NOT put the real value
# here in plaintext). Run:
#   wrangler secret put ADMIN_KEY
